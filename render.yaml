services:
  - type: web
    name: riftvoice-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUSTED_PROXIES
        value: private

      - key: PLAYER_GRANTS_JSON
        sync: false
      - key: CASTER_GRANTS_JSON
        sync: false
      - key: ALLOWED_WEB_ORIGINS
        value: ""
      - key: ENEMY_CAMERA_VOICE
        value: "0"
      - key: ORGANIZER_PASSWORD
        sync: false
      - key: MODERATOR_ACCOUNTS_JSON
        value: "[]"
