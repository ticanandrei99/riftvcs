[package]
name = "riftvoice"
version = "0.3.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
windows = { version = "0.58", features = [
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_Foundation",
] }

# "App audio" (audio_out.rs): the voices played by lolproxchat.exe itself, so OBS
# can capture them as this application.
cpal = "0.15"

# Per-game debug bundles (game_bundle.rs).
zip = { version = "9", default-features = false, features = ["deflate"] }
# Match the COM interface versions used by the locked Wry runtime.
webview2-com = "0.39"
windows-core = "0.62"

[build-dependencies]
tauri-build = { version = "2", features = [] }
