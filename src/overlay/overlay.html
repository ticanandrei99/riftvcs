<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Voxdria</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <!-- Panel window. Scanner/calibration region lives in a separate Tauri window. -->
  <div id="panel" class="panel">
    <div id="drag-handle" class="widget-header" data-tauri-drag-region>
      <span class="widget-title" data-tauri-drag-region title="Voxdria" aria-label="Voxdria">
        <svg class="voxdria-mark" viewBox="0 0 28 28" aria-hidden="true" focusable="false">
          <path d="M14 1 25 7v14l-11 6-11-6V7Z" fill="#340b16" stroke="#f45a75" stroke-width="1.4" stroke-linejoin="round"/>
          <path d="M7 7h4l3 10 3-10h4l-5 15h-4Z" fill="#ffd2dc"/>
          <path d="M1 10v8M27 10v8" fill="none" stroke="#ff8098" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </span>
      <div class="header-controls">
        <button id="btn-self-mute" class="icon-btn" data-i18n-title="header.selfMute" title="Toggle Self Mute"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/><path class="mute-slash" d="m3 3 18 18"/></svg></button>
        <button id="btn-mute-all" class="icon-btn" data-i18n-title="header.muteAll" title="Mute All"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 9V5a3 3 0 0 1 6 0v7M5 10v2a7 7 0 0 0 12 5M12 19v3M8 22h8M3 3l18 18"/></svg></button>
        <button id="btn-reset-header" class="icon-btn" data-i18n="header.posLabel" data-i18n-title="header.pos" title="Wrong position? If people next to you can't hear you, click this, then walk somewhere: the app finds your champion on the minimap again. Until it does, only your team hears you.">POS</button>
        <button id="btn-settings" class="icon-btn" data-i18n-title="header.settings" title="Settings"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 2-1 3-3 1-3-1-2 4 2 2v2l-2 2 2 4 3-1 3 1 1 3h4l1-3 3-1 3 1 2-4-2-2v-2l2-2-2-4-3 1-3-1-1-3Z"/><circle cx="12" cy="12" r="3"/></svg></button>
        <button id="btn-minimize" class="icon-btn" data-i18n-title="header.minimize" aria-label="Minimize" title="Minimize">&minus;</button>
        <button id="btn-close" class="icon-btn close-btn" data-i18n-title="header.close" aria-label="Close Voxdria" title="Close Voxdria">&times;</button>
        <button id="btn-collapse" class="icon-btn" title="Collapse"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 14 5-5 5 5"/></svg></button>
      </div>
    </div>
    <div id="update-notice" role="status" hidden style="padding:8px;color:#ffd2dc;background:#430d1a"><span id="update-notice-text"></span> <button id="btn-update-notice" class="icon-btn" data-i18n="update.downloadPage">UPDATE</button> <button id="btn-update-dismiss" class="icon-btn" data-i18n="update.later">Mai târziu</button></div>
    <div id="reset-notice" class="reset-notice hidden"></div>
    <div id="audio-state-notice" role="status" hidden></div>
    <div id="player-list" class="player-list">
      <div class="empty-state" data-i18n="players.waiting">Waiting for nearby players...</div>
    </div>
    <section id="voice-invitation-panel" aria-label="Conectare la custom"></section>
    <div id="settings-panel" class="settings-panel hidden">
      <section id="voice-panel" aria-label="Champion Voice Engine"></section>
      <div class="setting-row">
        <label data-i18n="settings.language">Language</label>
        <select id="language"></select>
      </div>
      <div class="setting-row">
        <label data-i18n="settings.inputDevice">Input Device</label>
        <select id="input-device">
          <option value="" data-i18n="settings.default">Default</option>
        </select>
      </div>
      <div class="setting-row">
        <label data-i18n="settings.outputDevice">Output Device</label>
        <select id="output-device">
          <option value="" data-i18n="settings.default">Default</option>
        </select>
      </div>
      <div class="setting-row">
        <label data-i18n="settings.appAudio" data-i18n-title="settings.appAudioHint" title="When ON, the voices are played by voxdria.exe itself instead of the built-in browser, so OBS can capture them with Application Audio Capture → [voxdria.exe] on their own track. Output Device then lists the devices voxdria.exe sees. Use headphones: with speakers the others may hear themselves back. On by default.">App audio (OBS)</label>
        <button id="btn-app-audio" class="icon-btn">ON</button>
      </div>
      <div class="setting-row">
        <label data-i18n="settings.inputMode">Input Mode</label>
        <select id="input-mode">
          <option value="always" data-i18n="settings.alwaysOpen">Always Open</option>
          <option value="ptt" data-i18n="settings.pushToTalk">Push to Talk</option>
        </select>
      </div>
      <div class="setting-row">
        <label data-i18n="settings.pttKey" data-i18n-title="settings.pttKeyHint" title="Push-to-talk key, used only in Push to Talk mode. Default: the key left of 1 (` on US keyboards, º on Spanish ones).">PTT Key</label>
        <button id="btn-bind-ptt" class="icon-btn">`</button>
      </div>
      <div class="setting-row">
        <label data-i18n="settings.toggleKey" data-i18n-title="settings.toggleKeyHint" title="Optional toggle-self-mute hotkey. Click to bind a key; click again to clear.">Toggle-mute Key</label>
        <button id="btn-bind-toggle" class="icon-btn">(unbound)</button>
      </div>
      <div class="setting-row">
        <label data-i18n="settings.micVolume">Mic Volume</label>
        <div class="setting-value-group">
          <input id="input-volume" type="range" min="0" max="100" value="100">
          <span id="volume-label" class="setting-value-label">100</span>
        </div>
      </div>
      <div class="setting-row">
        <label data-i18n="settings.forceTurn" data-i18n-title="settings.forceTurnHint" title="Routes all voice through the TURN relay so peers never see your public IP. Adds ~20-100ms latency. Takes effect on next peer connection. On by default.">Hide IP (Force TURN)</label>
        <button id="btn-force-turn" class="icon-btn">ON</button>
      </div>
      <div class="setting-row">
        <label data-i18n="settings.cameraOnly" data-i18n-title="settings.cameraOnlyHint" title="When ON (default), you hear exactly the players whose icons are inside your camera's white box on the minimap, and nobody else: not even someone beside you if your camera is elsewhere. Enemies only while their icon is drawn on your minimap, so one in a brush or in the fog stays silent. Others hear you when YOUR icon is inside THEIR box: looking at someone never makes them hear you. Does not need the app to find your own icon. Overrides Ally proximity and Voice on camera while on. Everyone should use the same version for it to work both ways.">Camera mode</label>
        <button id="btn-camera-only" class="icon-btn">ON</button>
      </div>
      <div class="setting-row">
        <label data-i18n="settings.allyProximity" data-i18n-title="settings.allyProximityHint" title="When ON (default), teammates fade with distance just like enemies. When OFF, teammates are always at full volume. Takes effect on the next position update.">Ally proximity</label>
        <button id="btn-ally-proximity" class="icon-btn">ON</button>
      </div>
      <div class="setting-row">
        <label id="enemy-camera-label">Inamici apropiați în cameră</label>
        <button id="btn-enemy-camera" class="icon-btn">ON</button>
      </div>
      <p id="enemy-camera-status" role="status" style="font-size:11px;padding:0 14px;opacity:.8">Necesită activarea de către organizator pe server.</p>
      <div class="setting-row">
        <label data-i18n="settings.cameraListen" data-i18n-title="settings.cameraListenHint" title="When ON, you also hear the champions inside your camera's white box on the minimap — what is on your screen — not just those near your champion. Enemies only while their icon is on your minimap, as everywhere: one in a brush or in the fog stays silent. One-way: the people you listen in on only hear you if they are near your champion or looking at you themselves. Only works between players who BOTH have it on: leave it off and nobody's Voice on camera can reach you. (Players in Camera mode still hear you while your icon is inside their camera box.) On by default.">Voice on camera</label>
        <button id="btn-camera-listen" class="icon-btn">ON</button>
      </div>
      <div class="setting-row">
        <label data-i18n="settings.wrongPosition" data-i18n-title="settings.wrongPositionHint" title="If people near you can't hear you, the app may be tracking the wrong icon on your minimap (it can latch onto a ward you walked past). This drops the current position and finds your champion again; walk somewhere after pressing it so it can tell you apart. Until it finds you, only your team hears you.">Wrong position?</label>
        <button id="btn-reset-position" class="icon-btn">RESET</button>
      </div>
      <div class="setting-row">
        <label data-i18n="settings.sharedReset" data-i18n-title="settings.sharedResetHint" title="When ON, pressing RESET also makes everyone else in the game who has this on find their champion on the minimap again, and their RESETs do the same for you. On by default. Only works between players who have it on: leave it off and nobody's RESET reaches you. Either team can use it, at most once every 15 seconds per game.">Shared RESET</label>
        <button id="btn-shared-reset" class="icon-btn">ON</button>
      </div>
      <div id="developer-controls">
      <div class="setting-row">
        <label data-i18n="settings.debug">Debug</label>
        <button id="btn-debug" class="icon-btn">OFF</button>
      </div>
      <div class="setting-row">
        <label data-i18n="settings.debugLogs">Debug Logs</label>
        <button id="btn-open-logs" class="icon-btn" data-i18n="settings.open" data-i18n-title="settings.openLogsHint" title="Open log folder to attach to a GitHub issue">OPEN</button>
      </div>
      <div class="setting-row">
        <label data-i18n="settings.autoUpdate">Auto-update</label>
        <button id="btn-autoupdate" class="icon-btn">OFF</button>
      </div>
      <div class="setting-row">
        <label data-i18n="settings.updates">Updates</label>
        <button id="btn-check-update" class="icon-btn" data-i18n="settings.check">CHECK</button>
      </div>
      <button id="btn-release-page" class="voice-test" hidden data-i18n="update.downloadPage"></button>
      <div id="update-status" style="font-size:10px;color:#8892a8;padding:4px 0;text-align:center;"></div>
      <div id="scan-rate-row" class="setting-row hidden">
        <label data-i18n="settings.scanRate">Scan Rate</label>
        <div class="setting-value-group">
          <input id="input-scan-rate" type="range" min="0" max="100" value="50">
          <span id="scan-rate-label" class="setting-value-label">50</span>
        </div>
      </div>
      <div id="debug-info" class="hidden" style="font-size:10px;color:#555;padding:4px 0;text-align:center;"></div>
      <img id="debug-filter-thumb" class="hidden" alt="HSV-filtered minimap preview" />
      </div>
    </div>
  </div>
  <script src="../background/background.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
